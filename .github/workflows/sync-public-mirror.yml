name: Sync public mirror

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: sync-public-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    name: "Push to public mirror"
    if: vars.APP_REPO_SUFFIX != '' && endsWith(github.repository, vars.APP_REPO_SUFFIX)
    env:
      PUBLIC_REPO: LedgerHQ/ledger-secure-sdk
    steps:
    - name: Generate token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.SDK_MIRROR_APP_ID }}
        private-key: ${{ secrets.SDK_MIRROR_APP_PRIVATE_KEY }}
        owner: LedgerHQ
        repositories: ledger-secure-sdk

    - name: Clone repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Push to public mirror
      env:
        TOKEN: ${{ steps.app.outputs.token }}
      run: |
        git push --atomic "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" \
          "refs/remotes/origin/master:refs/heads/master" \
          "refs/remotes/origin/API_LEVEL_*:refs/heads/API_LEVEL_*" \
          "refs/tags/*:refs/tags/*"
